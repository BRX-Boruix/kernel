[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
# 真机调度档：透传至 task，每个 100Hz LAPIC tick 触发一次 RR 调度；默认 TCG 档为 10 tick。
real-hw = ["task/real-hw"]
# 编译带自检测试（kernel::tests）的内核。默认关闭；SDK 的
# `build --test` / `br --test` 会显式启用该 feature。
# 透传 task/kernel-tests：启用 scheduler::test_hooks（waitpid 核心单测钩子）。
# 透传 ipc/kernel-tests：启用 shm 记账探针（ipc1 IA1 验收）。
# 透传 driver/kernel-tests：启用 DriverHub 槽位残留诊断访问器。
kernel-tests = ["task/kernel-tests", "ipc/kernel-tests", "driver/kernel-tests"]
# 临时诊断：HDA 设备 DMA 前端探针（隔离用，默认关闭）。
hda-probe = ["kernel-tests"]
# M3.3 用户态异常停机验收：进程在用户态触发 #UD 后由"进程终止"处理器
# 接管并停机（验收后停，不返回主流程）。因会卡住后续启动，默认关闭；
# SDK 的 `--test-m3.3` 显式启用。隐含 kernel-tests。
# 透传 task/kernel-test-m33：启用 ProcessTable::run。
kernel-test-m33 = ["kernel-tests", "task/kernel-test-m33"]
# ADR-034 PRE-2 停机验收：用户态 #PF 时 CR2 透传进 user_fault_handler
# （验收后停，不返回主流程）。隐含 kernel-tests；复用 task/kernel-test-m33
# 的 ProcessTable::run。
kernel-test-pre2 = ["kernel-tests", "task/kernel-test-m33"]
# M4.1 syscall 停机验收：用户代码经 `int 0x80` 调用 write/now/exit 等，
# 验证 syscall ABI 全链路（验收后停，不返回主流程）。隐含 kernel-tests。
# 透传 task/kernel-test-m41：启用 ProcessTable::run。
kernel-test-m41 = ["kernel-tests", "task/kernel-test-m41"]
# ADR-034 S1-13 信号停机验收：真实用户态进程捕获信号→handler→restorer→
# rt_sigreturn→恢复现场（验收后停，不返回主流程）。隐含 kernel-tests；
# 复用 task/kernel-test-m33 的 ProcessTable::run。
#
# 停机验收跑完即停、互斥，故每个验收测试独立一个 feature，各自独立 build+QEMU
# 运行（一次只编译并运行一个 halt 测试，避免死代码）。由 sdk 的 `--test-signal`
# + `--signal-halt nested|handler|fault` 选择启用哪一个。
kernel-test-signal-handler = ["kernel-tests", "task/kernel-test-m33"]
kernel-test-signal-fault = ["kernel-tests", "task/kernel-test-m33"]
kernel-test-signal-nested = ["kernel-tests", "task/kernel-test-m33"]
# M4.2 调度器停机验收：多进程 RR 轮转（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m42 = ["kernel-tests"]
# M4.3 静态 ELF 加载验收：加载 ELF 镜像并运行（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m43 = ["kernel-tests"]
# M4.4 真实用户程序验收：include_bytes! 嵌入 libsys+init 编译的 ELF 并运行
# （验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m44 = ["kernel-tests"]
# M5 写时复制（COW）验收：`clone_cow` 派生共享用户区的子地址空间（纯内存
# 逻辑，返回主流程继续启动）。隐含 kernel-tests。
kernel-test-m5 = ["kernel-tests"]
# C7.1/#7 waitpid 停机验收：真实父子进程经 int 0x80 全链路——父进程
# SYS_TASK_WAIT 阻塞、子进程 SYS_TASK_EXIT(42)、父进程被交付退出码后
# 校验 rax==42 并回写标记（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-waitpid = ["kernel-tests"]

[build-dependencies]

[dependencies]
brxlimine-rs = { path = "../../vendor/brxlimine-rs", features = ["requests-section"] }
klib = { path = "../klib" }
driver = { path = "../driver" }
fs = { path = "../fs" }
arch = { path = "../arch/arch" }
arch-x86_64 = { path = "../arch/arch-x86_64" }
mm = { path = "../mm" }
vfs = { path = "../vfs" }
task = { path = "../task" }
ipc = { path = "../ipc" }
loader = { path = "../loader", features = ["user-space"] }
term = { path = "../term" }
spin = "0.9"
