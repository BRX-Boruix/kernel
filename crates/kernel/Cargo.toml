[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
# 编译带自检测试（kernel::tests）的内核。默认关闭；SDK 的
# `build --test` / `br --test` 会显式启用该 feature。
kernel-tests = []

[build-dependencies]

[dependencies]
limine = { version = "0.1", features = ["requests-section"] }
flanterm_rust = { path = "../../vendor/flanterm_rust" }
klib = { path = "../klib" }
drv = { path = "../drv" }
arch = { path = "../arch/arch" }
arch-x86_64 = { path = "../arch/arch-x86_64" }
mm = { path = "../mm" }
