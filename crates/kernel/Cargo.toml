[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
# 真机调度档：透传至 task，每个 100Hz LAPIC tick 触发一次 RR 调度；默认 TCG 档为 10 tick。
real-hw = ["task/real-hw"]
# 编译带自检测试（kernel::tests）的内核。默认关闭；SDK 的
# `build --test` / `br --test` 会显式启用该 feature。
kernel-tests = []
# M3.3 用户态异常停机验收：进程在用户态触发 #UD 后由"进程终止"处理器
# 接管并停机（验收后停，不返回主流程）。因会卡住后续启动，默认关闭；
# SDK 的 `--test-m3.3` 显式启用。隐含 kernel-tests。
kernel-test-m33 = ["kernel-tests"]
# M4.1 syscall 停机验收：用户代码经 `int 0x80` 调用 write/now/exit 等，
# 验证 syscall ABI 全链路（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m41 = ["kernel-tests"]
# M4.2 调度器停机验收：多进程 RR 轮转（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m42 = ["kernel-tests"]
# M4.3 静态 ELF 加载验收：加载 ELF 镜像并运行（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m43 = ["kernel-tests"]
# M4.4 真实用户程序验收：include_bytes! 嵌入 libsys+init 编译的 ELF 并运行
# （验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m44 = ["kernel-tests"]
# M5 写时复制（COW）验收：`clone_cow` 派生共享用户区的子地址空间（纯内存
# 逻辑，返回主流程继续启动）。隐含 kernel-tests。
kernel-test-m5 = ["kernel-tests"]

[build-dependencies]

[dependencies]
limine = { version = "0.1", features = ["requests-section"] }
flanterm_rust = { path = "../../vendor/flanterm_rust" }
klib = { path = "../klib" }
drv = { path = "../drv" }
arch = { path = "../arch/arch" }
arch-x86_64 = { path = "../arch/arch-x86_64" }
mm = { path = "../mm" }
vfs = { path = "../vfs" }
task = { path = "../task" }
ipc = { path = "../ipc" }
loader = { path = "../loader" }
term = { path = "../term" }
spin = "0.9"
