[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[features]
# 编译带自检测试（kernel::tests）的内核。默认关闭；SDK 的
# `build --test` / `br --test` 会显式启用该 feature。
kernel-tests = []
# M3.3 用户态异常停机验收：进程在用户态触发 #UD 后由"进程终止"处理器
# 接管并停机（验收后停，不返回主流程）。因会卡住后续启动，默认关闭；
# SDK 的 `--test-m3.3` 显式启用。隐含 kernel-tests。
kernel-test-m33 = ["kernel-tests"]
# M4.1 syscall 停机验收：用户代码经 `int 0x80` 调用 write/now/exit 等，
# 验证 syscall ABI 全链路（验收后停，不返回主流程）。隐含 kernel-tests。
kernel-test-m41 = ["kernel-tests"]

[build-dependencies]

[dependencies]
limine = { version = "0.1", features = ["requests-section"] }
flanterm_rust = { path = "../../vendor/flanterm_rust" }
klib = { path = "../klib" }
drv = { path = "../drv" }
arch = { path = "../arch/arch" }
arch-x86_64 = { path = "../arch/arch-x86_64" }
mm = { path = "../mm" }
