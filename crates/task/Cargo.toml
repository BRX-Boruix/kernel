[package]
name = "task"
version.workspace = true
edition.workspace = true

[features]
# QEMU TCG 默认需要较长的虚拟时间片；启用此项时改为真机档位（每个 LAPIC tick 调度）。
real-hw = []

[dependencies]
klib = { path = "../klib" }
arch = { path = "../arch/arch" }
arch-x86_64 = { path = "../arch/arch-x86_64" }
mm = { path = "../mm" }
drv = { path = "../drv" }
vfs = { path = "../vfs" }
spin = "0.9"
